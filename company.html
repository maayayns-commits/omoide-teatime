<script>
document.addEventListener("DOMContentLoaded", () => {

  const openBtn = document.getElementById("menuOpen");
  const closeBtn = document.getElementById("menuClose");
  const panel = document.getElementById("menuPanel");
  const bg = document.getElementById("menuBg");

  openBtn.addEventListener("click", () => {
    panel.classList.add("open");
    bg.classList.add("open");
  });

  closeBtn.addEventListener("click", () => {
    panel.classList.remove("open");
    bg.classList.remove("open");
  });

  bg.addEventListener("click", () => {
    panel.classList.remove("open");
    bg.classList.remove("open");
  });

});
</script>

<script>
const flavorToggle =
  document.getElementById("flavorToggle");

const flavorMenu =
  document.getElementById("flavorMenu");

flavorToggle.addEventListener("click", () => {

  flavorMenu.classList.toggle("open");

  if (flavorMenu.classList.contains("open")) {
    flavorToggle.textContent = "フレーバー ▲";
  } else {
    flavorToggle.textContent = "フレーバー ▼";
  }

});
</script>
